[project]
name = "dictionary-app"
version = "0.1.0"
description = "Распознавание заявок клиентов по словарю синонимов"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=23",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.110",
    "respx>=0.21",
    "pyftpdlib>=2.0",
    "pytest-playwright>=0.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-openpyxl",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # русский текст в строках и комментариях

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov --cov-report=term-missing"
markers = [
    "db: нужен PostgreSQL (TEST_DATABASE_URL)",
    "e2e: браузерные тесты Playwright",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
